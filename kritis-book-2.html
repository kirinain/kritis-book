html, body { height: 100%; }
body { margin: 0; background: var(--room); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
#stage canvas:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }
.top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; right: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; pointer-events: none; }

.brand i { font-style: italic; }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 10px; background: var(--chip); color: var(--ink); border: 0; border-radius: 999px; box-shadow: 0 6px 20px -10px rgba(80,50,40,.4); font: 500 13px/1 var(--font-body); cursor: pointer; font-variant-numeric: tabular-nums; }
.chip:hover { box-shadow: 0 0 0 1px var(--chip-line), 0 6px 20px -10px rgba(80,50,40,.4); }
.chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip svg { flex: none; }
.chip small { font-weight: 400; color: var(--soft); font-size: 12px; }
.hint { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 82px); text-align: center; font-family: var(--font-note); font-size: 25px; color: #FFFDFB; pointer-events: none; text-wrap: balance; text-shadow: 0 1px 2px rgba(60,35,30,.45), 0 2px 14px rgba(60,35,30,.35); transition: opacity .8s ease; }
